<script>
// Mini-VGA : mode 13h (320x200, 256 couleurs, palette 6 bits) pour un <canvas>.
// Remplace GraphMode / Vga[] / Put_dac / Cls / LoadShoot des unités Pascal GEST_GRA et GEST_DAC.
class VGA {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.mem = new Uint8Array(65536);          // segment $A000 entier (64 Ko) ; seuls 64000 octets sont affichés
    this.lut = new Uint8Array(256 * 3);        // palette 8 bits (R,V,B)
    this.img = this.ctx.createImageData(320, 200);
    this.px = this.img.data;                  // Uint8ClampedArray RGBA
    this.putDac(new Array(768).fill(0));
  }
  // Put_dac : 768 valeurs 0..63 (R,V,B)
  putDac(p) {
    for (let i = 0; i < 256; i++) {
      const r = Math.round(p[i * 3] * 255 / 63), g = Math.round(p[i * 3 + 1] * 255 / 63), b = Math.round(p[i * 3 + 2] * 255 / 63);
      this.lut[i * 3] = r; this.lut[i * 3 + 1] = g; this.lut[i * 3 + 2] = b;
    }
  }
  cls(c) { this.mem.fill(c & 255); }
  // Format SHOOT : 1 octet d'en-tête, 768 octets de palette (6 bits), 64000 pixels
  loadShoot(base64) {
    const bin = atob(base64), n = bin.length, b = new Uint8Array(n);
    for (let i = 0; i < n; i++) b[i] = bin.charCodeAt(i);
    this.putDac(Array.from(b.subarray(1, 769)));
    this.mem.set(b.subarray(769, 769 + 64000), 0);
  }
  present() {
    const m = this.mem, l = this.lut, px = this.px;
    for (let i = 0, o = 0; i < 64000; i++, o += 4) { const c = m[i] * 3; px[o] = l[c]; px[o + 1] = l[c + 1]; px[o + 2] = l[c + 2]; px[o + 3] = 255; }
    this.ctx.putImageData(this.img, 0, 0);
  }
}
window.VGA = VGA;

<script>
// MATHEMATICA 3 — Malorean Effect, release novembre 1993. Code d'origine : Volpone (code), Toto (gfx), Sally (musique).
// Port JavaScript de MAT3.PAS. Chaque procédure Pascal devient un générateur :
//   `yield`        = une étape d'animation (réglable avec le curseur de vitesse)
//   `yield 2000`   = Delay(2000), en millisecondes réelles
// Les arithmétiques 16 bits de Turbo Pascal (Word) sont reproduites avec & 0xFFFF,

const P = window.PALETTES, SHOOT = window.SHOOT;
const V = 32160;                                   // V : ARRAY ... ABSOLUTE $A000:32160  (= centre de l'écran, 100*320+160)
const pround = x => x < 0 ? -Math.round(-x) : Math.round(x);
const w16 = x => x & 0xFFFF;

// Les 8 écritures symétriques utilisées partout (ordre identique au Pascal)
function sym(mem, xe, ye, c) {
  const a = ye * 320, b = xe * 320;
  mem[V + a + xe] = c; mem[V + b + ye] = c;
  mem[V - a + xe] = c; mem[V - b + ye] = c;
  mem[V - a - xe] = c; mem[V - b - ye] = c;

function* pasm(vga) {
  const m = vga.mem; vga.putDac(P.PAL4);

function drawCredits(canvas) {

  const t = ' CREDIT FOR THE DEMO '; text(40 - Math.floor(t.length / 2), 5, 'BLANC', 'BLEU', t);
  text(24, 7, 'BLANC', 'MAGENTA', 'VOLPONE          : CODE ');
  text(24, 9, 'BLANC', 'MAGENTA', 'TOTO             : CODE ');
  text(10, 11, 'BLANC', 'BLEU', '                      SHAREWARE CREDIT                       ');
  text(12, 13, 'BLANC', 'MAGENTA', 'PALETTES         : ALL PALETTES ARE RIPED FROM FRACTINT   ');
  text(12, 14, 'BLANC', 'MAGENTA', 'PLAYER           : MOD-OBJ by MARK J COX ');
  text(12, 15, 'BLANC', 'MAGENTA', 'TRACKER          : PROTRACKER 2.3 ');
  text(12, 16, 'BLANC', 'MAGENTA', 'SCREEN CAPTURE   : SHOOT 2 By PHAM CONG-DUC ');
  text(10, 18, 'BLANC', 'BLEU', '                           HELLO TO                          ');

}

// ---------------------------------------------------------------- Programme principal, découpé en scènes
const image = (n, src) => function* (vga) { vga.loadShoot(SHOOT[n]); yield 5000; };
window.SCENES = [
  { name: 'Data.000', note: 'LoadShoot(\'Data.000\') puis Delay(5000)', run: image('Data.000') },
  { name: 'Moy_3 · Rac_3 · Moy_4 · Rac_4', note: 'Procédures moy_3, rac_3, moy_4, rac_4 (répertoire « moyenne »). Écran en symétrie à 8.',
    run: function* (v) { v.cls(0); yield* moy3(v); yield* rac3(v); yield 2000; yield* moy4(v); yield* rac4(v); yield 2000; } },
  { name: 'Data.004', note: 'Image', run: image('Data.004') },
  { name: 'Pasm', note: 'Procédure Pasm (répertoire « flower ») : cou = (T_Cou1 * X) div T_Cou2, X de 1 à 300.',
    run: function* (v) { v.cls(0); yield* pasm(v); } },

    run: function* (v) { v.cls(0); yield* oly14(v); yield 500; yield* poly8(v); yield 5000; yield* poly10(v); yield 5000; } },
  { name: 'Data.005', note: 'Image', run: image('Data.005') },
  { name: 'New6 · New14', note: 'Procédures New6 (f+s)²−(f+g)² et New14 (répertoire « CONG »).',
    run: function* (v) { v.cls(1); yield* new6(v); v.cls(1); yield* new14(v); } },

    run: function* (v) { v.cls(0); for (const r of [rot2, rot9, rot20, rot14, rot15, rot16]) { yield* r(v); yield 2000; } } },
  { name: 'Data.003', note: 'Image', run: image('Data.003') },
  { name: 'Crédits', note: 'Page_Credit : écran texte 80×25, 250 ticks (~14 s).', text: true, run: function* () { yield 13700; } },
];
window.drawCredits = drawCredits;

</script>
<script>
const $ = id => document.getElementById(id);
const vgaCv = $('vga'), txtCv = $('txt'), vga = new VGA(vgaCv);
const sel = $('scenes');
SCENES.forEach((s, i) => sel.add(new Option(String(i + 1).padStart(2, '0') + ' · ' + s.name, i)));

let idx = 0, gen = null, paused = false, waitLeft = 0, acc = 0, last = performance.now();
function start(i) {
  idx = ((i % SCENES.length) + SCENES.length) % SCENES.length;
  const s = SCENES[idx];
  gen = s.run(vga); waitLeft = 0; acc = 0;
  sel.value = idx; $('sname').textContent = s.name; $('snote').textContent = s.note;
  txtCv.style.display = s.text ? 'block' : 'none'; vgaCv.style.display = s.text ? 'none' : 'block';
  if (s.text) drawCredits(txtCv);
}
function frame(t) {
  const dt = Math.min(100, t - last); last = t;
  if (!paused) {
    if (waitLeft > 0) waitLeft -= dt;
    else {
      acc = Math.min(acc + dt * $('speed').value / 1000, 4);
      while (acc >= 1) {
        acc--;
        const r = gen.next();
        if (r.done) { start(idx + 1); break; }
        if (typeof r.value === 'number') { waitLeft = r.value; break; }
      }
    }
  }
  vga.present();
  requestAnimationFrame(frame);
}
$('prev').onclick = () => start(idx - 1);
$('next').onclick = () => start(idx + 1);
sel.onchange = () => start(+sel.value);
$('play').onclick = () => { paused = !paused; $('play').textContent = paused ? '▶ Lecture' : '⏸ Pause'; };
$('speed').oninput = e => $('speedv').textContent = e.target.value + ' /s';
addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.key === ' ') { e.preventDefault(); $('play').click(); }
  else if (e.key === 'ArrowRight') start(idx + 1);
  else if (e.key === 'ArrowLeft') start(idx - 1);
});
start(0); requestAnimationFrame(frame);
</script>
